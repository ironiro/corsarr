# Corsarr with Docker Compose
#
#   Start:   docker compose up -d
#   Logs:    docker compose logs -f
#   Update:  docker compose pull && docker compose up -d
#
# Then open http://<ip-of-this-host>:8787/ and set everything up in the web interface.
services:
  corsarr:
    # :latest (= :stable) tested releases · :beta pre-releases · :edge every commit on main · :1.2.0 a fixed version
    image: ghcr.io/ironiro/corsarr:latest
    build: .                 # used if the image cannot be pulled, or with: docker compose up -d --build
    container_name: corsarr
    restart: unless-stopped
    ports:
      # Web interface + webhooks for Jellyfin, Sonarr, Radarr. "8787:8787" listens on all interfaces
      # of the Docker host. To restrict it, put an address in front: "127.0.0.1:8787:8787" (only this
      # host, e.g. behind a reverse proxy) or "192.168.1.10:8787:8787" (one LAN interface).
      - "8787:8787"
    volumes:
      - corsarr-data:/data   # database, logs and settings from the web interface
    environment:
      TZ: Europe/Berlin      # time zone for logs and dates
    logging:                 # keep container logs bounded (the app also logs to /data/logs)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: "Update now" in the web interface. Needs the host service from deploy/ (as root):
    #   cp deploy/docker-update.sh <this directory>/
    #   cp deploy/corsarr-docker-update.{path,service} /etc/systemd/system/   (adjust the paths in both)
    #   touch update.log && systemctl enable --now corsarr-docker-update.path
    # then use a bind-mounted data directory and these lines instead of the image/volume above:
    #   image: ghcr.io/ironiro/corsarr:${CORSARR_TAG:-latest}   # the service sets CORSARR_TAG in .env
    #   volumes: ["./data:/data", "./update.log:/var/log/corsarr-update.log:ro"]
    #   environment:
    #     CORSARR_UPDATE_TRIGGER: /data/update-request
    #     CORSARR_UPDATE_LOG: /var/log/corsarr-update.log
    # Optional: settings from a file instead of (or before) the web interface,
    # template: .env.example
    # env_file:
    #   - path: .env
    #     required: false

volumes:
  corsarr-data:

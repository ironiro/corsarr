<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corsarr</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply the chosen skin before the first paint (no flash of the default look); app.js switches it.
    try {
      const skin = localStorage.getItem("corsarr.skin");
      document.documentElement.dataset.skin = ["arr", "terminal", "vhs", "soft"].includes(skin) ? skin : "vhs";
    } catch (e) { document.documentElement.dataset.skin = "vhs"; }
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/static/app.js"></script>
</body>
</html>
